<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#315efb">
<link rel="manifest" href="manifest.json">
<title>MY VOCAB TEST</title>
<style>
:root{--blue:#315efb;--bg:#f4f6fb;--ink:#202536}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#2448cf,#4775ff);color:white;padding:24px 18px 20px}
h1{margin:0 0 5px;font-size:25px}header p{margin:0;opacity:.9}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:white;position:sticky;top:0;z-index:2}
nav button{white-space:nowrap;border:0;border-radius:12px;padding:11px 14px;background:#edf1ff;color:#2345b8;font-weight:700}
nav button.active{background:var(--blue);color:white}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 3px 14px #1b2d5010}
h2{font-size:20px;margin:0 0 14px}
label{display:block;font-weight:650;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8dce7;border-radius:11px;font:inherit;background:white}
textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary{background:var(--blue);color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:750;font-size:15px}
button.secondary{background:#edf1ff;color:#2448cf;border:0;border-radius:10px;padding:9px 12px;font-weight:650}
button.danger{background:#fff0f0;color:#b42318;border:0;border-radius:10px;padding:9px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.word{border:1px solid #e5e8f0;border-radius:13px;padding:13px;margin:9px 0}
.word strong{font-size:18px}.muted{color:#687087;font-size:13px}
.hidden{display:none!important}.pill{display:inline-block;background:#eef2ff;color:#3152bf;border-radius:20px;padding:3px 8px;font-size:12px;margin:5px 4px 0 0}
#feedback{font-weight:700;margin-top:10px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>MY VOCAB TEST</h1><p>내가 공부한 단어를 모으고, 듣고, 시험 보는 나만의 단어장</p></header>
<nav>
<button class="active" data-tab="register">단어 등록</button>
<button data-tab="list">단어장</button>
<button data-tab="quiz">랜덤 시험</button>
<button data-tab="backup">백업·복원</button>
</nav>
<main>
<section id="register" class="tab">
<div class="card"><h2 id="formTitle">단어 등록</h2>
<label>영어 단어 *</label><input id="en" placeholder="예: achieve" autocomplete="off">
<label>뜻 *</label><input id="meaning" placeholder="예: 성취하다, 달성하다">
<div class="row"><div><label>품사</label><select id="pos"><option>선택 안 함</option><option>명사</option><option>동사</option><option>형용사</option><option>부사</option><option>전치사</option><option>접속사</option><option>숙어</option><option>기타</option></select></div>
<div><label>난이도</label><select id="level"><option>초급</option><option>중급</option><option>고급</option></select></div></div>
<label>용도·카테고리</label><select id="category"><option>일상</option><option>업무</option><option>여행</option><option>시험</option><option>군사·전문</option><option>기타</option></select>
<label>예문 (선택)</label><textarea id="example" placeholder="예: I achieved my goal."></textarea>
<div class="actions"><button class="primary" id="saveBtn">단어 추가</button><button class="secondary" id="clearBtn">입력 초기화</button></div>
<p class="muted">단어는 현재 사용 중인 브라우저에 저장됩니다. 정기적으로 백업해 주세요.</p>
</div></section>
<section id="list" class="tab hidden">
<div class="card"><h2>내 단어장</h2>
<div class="row"><select id="filterLevel"><option value="">모든 난이도</option><option>초급</option><option>중급</option><option>고급</option></select><select id="filterCat"><option value="">모든 카테고리</option><option>일상</option><option>업무</option><option>여행</option><option>시험</option><option>군사·전문</option><option>기타</option></select></div>
<p id="count" class="muted"></p><div id="wordList"></div>
</div></section>
<section id="quiz" class="tab hidden"><div class="card"><h2>랜덤 시험</h2>
<div class="row"><div><label>문제 수</label><select id="quizCount"><option>10</option><option>20</option><option>30</option><option>전체</option></select></div><div><label>문제 유형</label><select id="quizType"><option value="meaning">뜻 보고 영어 쓰기</option><option value="english">영어 보고 뜻 쓰기</option></select></div></div>
<div class="row"><div><label>난이도</label><select id="quizLevel"><option value="">전체</option><option>초급</option><option>중급</option><option>고급</option></select></div><div><label>카테고리</label><select id="quizCat"><option value="">전체</option><option>일상</option><option>업무</option><option>여행</option><option>시험</option><option>군사·전문</option><option>기타</option></select></div></div>
<div class="actions"><button class="primary" id="startQuiz">시험 시작</button></div>
<div id="quizArea" class="hidden"><p class="muted" id="progress"></p><h2 id="question"></h2><input id="answer" placeholder="정답 입력"><div class="actions"><button class="primary" id="checkAnswer">정답 확인</button><button class="secondary hidden" id="nextQuestion">다음 문제</button></div><p id="feedback"></p></div>
<div id="result"></div></div></section>
<section id="backup" class="tab hidden"><div class="card"><h2>데이터 백업·복원</h2><p>휴대폰을 바꾸거나 브라우저 데이터가 삭제될 경우를 대비해 백업 파일을 보관하세요.</p>
<div class="actions"><button class="primary" id="exportJson">전체 백업(JSON)</button><button class="secondary" id="exportCsv">CSV 내보내기</button></div>
<label>백업 파일 복원(JSON)</label><input type="file" id="importFile" accept=".json,application/json"><p class="muted">복원하면 현재 단어장에 백업 내용이 추가됩니다. 같은 단어가 중복될 수 있습니다.</p>
</div></section>
</main>
<script>
const KEY='myVocabWordsV1'; let words=JSON.parse(localStorage.getItem(KEY)||'[]'), editId=null, quiz=[], qi=0, correct=0;
const $=id=>document.getElementById(id); const save=()=>localStorage.setItem(KEY,JSON.stringify(words));
function clearForm(){['en','meaning','example'].forEach(x=>$(x).value='');$('pos').value='선택 안 함';$('level').value='초급';$('category').value='일상';editId=null;$('formTitle').textContent='단어 등록';$('saveBtn').textContent='단어 추가'}
$('clearBtn').onclick=clearForm;
$('saveBtn').onclick=()=>{let en=$('en').value.trim(),meaning=$('meaning').value.trim();if(!en||!meaning){alert('영어 단어와 뜻을 입력해 주세요.');return}
let item={id:editId||Date.now()+Math.random(),en,meaning,pos:$('pos').value,level:$('level').value,category:$('category').value,example:$('example').value.trim()};
if(editId){words=words.map(w=>w.id===editId?item:w)}else words.push(item);save();clearForm();render();alert('저장했습니다.')};
function render(){let l=words.filter(w=>(!$('filterLevel').value||w.level===$('filterLevel').value)&&(!$('filterCat').value||w.category===$('filterCat').value));$('count').textContent=`총 ${words.length}개 · 현재 표시 ${l.length}개`;
$('wordList').innerHTML=l.slice().reverse().map(w=>`<div class="word"><strong>${esc(w.en)}</strong> — ${esc(w.meaning)}<div><span class="pill">${esc(w.pos)}</span><span class="pill">${esc(w.level)}</span><span class="pill">${esc(w.category)}</span></div>${w.example?`<p class="muted">${esc(w.example)}</p>`:''}<div class="actions"><button class="secondary" onclick="speak('${String(w.en).replace(/'/g,"\\'")}')">🔊 발음</button><button class="secondary" onclick="editWord('${w.id}')">수정</button><button class="danger" onclick="deleteWord('${w.id}')">삭제</button></div></div>`).join('')||'<p class="muted">아직 등록된 단어가 없습니다.</p>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.speak=t=>{if(!('speechSynthesis'in window)){alert('이 브라우저는 음성 읽기를 지원하지 않습니다.');return}let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)};
window.editWord=id=>{let w=words.find(x=>String(x.id)===String(id));if(!w)return;editId=w.id;$('en').value=w.en;$('meaning').value=w.meaning;$('pos').value=w.pos;$('level').value=w.level;$('category').value=w.category;$('example').value=w.example;$('formTitle').textContent='단어 수정';$('saveBtn').textContent='수정 저장';document.querySelector('[data-tab="register"]').click();window.scrollTo(0,0)};
window.deleteWord=id=>{if(confirm('이 단어를 삭제할까요?')){words=words.filter(w=>String(w.id)!==String(id));save();render()}};
['filterLevel','filterCat'].forEach(id=>$(id).onchange=render);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab));if(b.dataset.tab==='list')render()});
$('startQuiz').onclick=()=>{let pool=words.filter(w=>(!$('quizLevel').value||w.level===$('quizLevel').value)&&(!$('quizCat').value||w.category===$('quizCat').value));if(!pool.length){alert('조건에 맞는 단어가 없습니다. 먼저 단어를 등록해 주세요.');return}pool.sort(()=>Math.random()-.5);let n=$('quizCount').value==='전체'?pool.length:Number($('quizCount').value);quiz=pool.slice(0,n);qi=0;correct=0;$('result').textContent='';$('quizArea').classList.remove('hidden');showQ()};
function showQ(){$('progress').textContent=`${qi+1} / ${quiz.length} 문제`;$('question').textContent=$('quizType').value==='meaning'?quiz[qi].meaning:quiz[qi].en;$('answer').value='';$('answer').disabled=false;$('feedback').textContent='';$('checkAnswer').classList.remove('hidden');$('nextQuestion').classList.add('hidden');$('answer').focus()}
$('checkAnswer').onclick=()=>{let w=quiz[qi],typed=$('answer').value.trim().toLowerCase(),ans=($('quizType').value==='meaning'?w.en:w.meaning).toLowerCase();let ok=typed===ans;if(ok)correct++;$('feedback').textContent=(ok?'정답입니다!':'오답입니다.')+' 정답: '+($('quizType').value==='meaning'?w.en:w.meaning);$('answer').disabled=true;$('checkAnswer').classList.add('hidden');$('nextQuestion').classList.remove('hidden')};
$('nextQuestion').onclick=()=>{qi++;if(qi<quiz.length)showQ();else{$('quizArea').classList.add('hidden');$('result').textContent=`시험 종료! ${quiz.length}문제 중 ${correct}문제 정답 (${Math.round(correct/quiz.length*100)}점)`}};
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$('exportJson').onclick=()=>download('my-vocab-backup.json',JSON.stringify(words,null,2),'application/json');
$('exportCsv').onclick=()=>{let rows=[['영어','뜻','품사','난이도','카테고리','예문'],...words.map(w=>[w.en,w.meaning,w.pos,w.level,w.category,w.example])];download('my-vocab.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8')};
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data))throw 0;words=words.concat(data.map(w=>({...w,id:Date.now()+Math.random()})));save();render();alert('복원했습니다.')}catch{alert('올바른 JSON 백업 파일이 아닙니다.')}e.target.value=''};
render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
